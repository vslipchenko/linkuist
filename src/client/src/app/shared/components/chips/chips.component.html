<mat-form-field [appWrapIf]="isInputAvailable">
  <mat-chip-list #chipList [attr.aria-label]="label">
    <mat-chip #chipItem="matChip"
      *ngFor="let chip of chips"
      [selectable]="chip.isSelectable || areChipsSelectable"
      [removable]="chip.isRemovable || areChipsRemovable"
      (removed)="chip.onRemove ? chip.onRemove($event) : removeChip($event)"
      [color]="
        chip.isSelected
        ? chipItem.selected
          ? chip.color
          : chipItem.toggleSelected() && chip.color
        : null
      "
    >
      {{chip.text || chip}}
      <mat-icon *ngIf="chip.isRemovable || areChipsRemovable"
                matChipRemove
                svgIcon="cancel"
      ></mat-icon>
    </mat-chip>
    <input *ngIf="isInputAvailable"
      #chipInput
      [placeholder]="label"
      [matAutocomplete]="autocomplete"
      [matChipInputFor]="chipList"
      [matChipInputSeparatorKeyCodes]="chipsSeparatorKeyCodes"
      [matChipInputAddOnBlur]="isAddOnBlurAvailable"
      (matChipInputTokenEnd)="appendChip($event)"/>
  </mat-chip-list>
  <mat-autocomplete #autocomplete
                    (opened)="loadAutocompleteOptions()"
                    (optionSelected)="onAutocompleteOptionSelect($event)">
    <mat-option *ngIf="areAutocompleteOptionsLoading; else autocompleteOptions"
                class="autocomplete-spinner"
                disabled=""
    >
      <mat-spinner></mat-spinner>
    </mat-option>
    <ng-template #autocompleteOptions>
      <mat-option *ngFor="let chip of []" [value]="chip.text || chip">
        {{chip.text || chip}}
      </mat-option>
    </ng-template>
  </mat-autocomplete>
</mat-form-field>
