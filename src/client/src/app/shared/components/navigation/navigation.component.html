<nav class="navigation">
  <div class="secondary-actions">
    <ng-content></ng-content>
  </div>
  <div class="main-action" [matTooltip]="tooltipContent" matTooltipPosition="above">
    <!-- Profile action -->
    <a
      *ngIf="isProfileMainAction"
      [routerLink]="userAccountPageUrl"
      mat-icon-button
      aria-label="Example icon button with a bookmark icon"
    >
      <mat-icon svgIcon="linkuist"></mat-icon>
    </a>
    <!-- Home icon action -->
    <a *ngIf="isHomeIconMainAction" routerLink="/" mat-icon-button>
      <mat-icon svgIcon="home"></mat-icon>
    </a>
    <!-- Home text action -->
    <a *ngIf="isHomeTextMainAction" [appWrapIf]="isHomeMainAction" routerLink="/">
      <h2 class="main-action-title as-h3">Linkuist</h2>
    </a>
  </div>
</nav>
