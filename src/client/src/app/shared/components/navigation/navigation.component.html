<nav class="navigation">
  <div class="secondary-actions">
    <ng-content></ng-content>
  </div>
  <div class="main-action" [matTooltip]="tooltipContent" matTooltipPosition="above">
    <ng-container [ngSwitch]="true">
      <!-- profileHomeAction -->
      <a *ngSwitchCase="configuration.mainActionHref && isUserAuthenticated" [routerLink]="configuration.mainActionHref" mat-icon-button aria-label="Example icon button with a bookmark icon">
        <mat-icon svgIcon="home"></mat-icon>
      </a>
      <!-- profileAction -->
      <a *ngSwitchCase="!configuration.mainActionHref && isUserAuthenticated" [routerLink]="userAccountPageUrl" mat-icon-button aria-label="Example icon button with a bookmark icon">
        <mat-icon svgIcon="linkuist"></mat-icon>
      </a>
      <!-- homeAction -->
      <a *ngSwitchCase="!isUserAuthenticated" [appWrapIf]="configuration.mainActionHref" [routerLink]="configuration.mainActionHref">
        <h2 class="main-action__label as-h3">Linkuist</h2>
      </a>
    </ng-container>
  </div>
</nav>
