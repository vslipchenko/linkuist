<ng-template #addBookmarkContent>
  <form [formGroup]="addBookmarkForm" class="add-bookmark">
    <mat-form-field class="link">
      <mat-label>Link</mat-label>
      <textarea type="url" matInput formControlName="link" required></textarea>
      <mat-error *ngIf="linkField.hasError('required')">Required field</mat-error>
      <mat-error *ngIf="linkField.hasError('pattern')"
        >Invalid format, e.g. http://example.com
      </mat-error>
    </mat-form-field>
    <!--    <mat-form-field>-->
    <!--      <mat-label>Title</mat-label>-->
    <!--      <input type="text" matInput formControlName="title" />-->
    <!--    </mat-form-field>-->
    <!--    <mat-form-field>-->
    <!--      <mat-label>Thumbnail url</mat-label>-->
    <!--      <input-->
    <!--        type="text"-->
    <!--        matInput-->
    <!--        formControlName="image"-->
    <!--        placeholder="e.g. https://example.com/flower.jpg"-->
    <!--      />-->
    <!--    </mat-form-field>-->
    <!--    <mat-form-field>-->
    <!--      <mat-label>Icon url</mat-label>-->
    <!--      <input-->
    <!--        type="text"-->
    <!--        matInput-->
    <!--        formControlName="icon"-->
    <!--        placeholder="e.g. https://example.com/favicon.ico"-->
    <!--      />-->
    <!--    </mat-form-field>-->
    <mat-form-field>
      <mat-label>Note</mat-label>
      <textarea
        type="text"
        matInput
        formControlName="note"
        placeholder="Something important..."
      ></textarea>
    </mat-form-field>
    <!--    <label for="" class="mat-form-field-label">Options</label>-->
    <div class="options">
      <mat-slide-toggle formControlName="isPrivate" labelPosition="after">Private</mat-slide-toggle>
      <mat-slide-toggle formControlName="isPaid" labelPosition="after">Paid</mat-slide-toggle>
    </div>
    <app-chips
      formControlName="tags"
      label="Tags"
      [areChipsLowerCased]="true"
      [areChipsRemovable]="true"
      [isInputAvailable]="true"
      [isAddOnBlurAvailable]="true"
      [chipsSeparatorKeyCodes]="tagsSeparatorKeysCodes"
      [chipSeparator]="tagSeparator"
      [chipLetterValidator]="tagLetterValidator"
      [chipSplitWordBy]="tagSplitWordBy"
    ></app-chips>
  </form>
</ng-template>
<ng-template #addBookmarkActions>
  <button mat-flat-button color="primary" (click)="addBookmark()">Add</button>
  <button mat-dialog-close mat-stroked-button>Close</button>
  <!--  [mat-dialog-close]="true"-->
  <!--    &lt;!&ndash; The mat-dialog-close directive optionally accepts a value as a result for the dialog. &ndash;&gt;-->
</ng-template>

<app-navigation [mainActionType]="navigationMainActionType">
  <ng-container *ngIf="isOwner">
    <button
      matTooltip="Add bookmark"
      matTooltipPosition="above"
      mat-icon-button
      (click)="openAddBookmarkDialog()"
    >
      <mat-icon svgIcon="bookmark-plus"></mat-icon>
    </button>
  </ng-container>
</app-navigation>
