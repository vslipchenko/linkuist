<main class="home">
  <div class="home-background">
    <img class="home-background__image" src="/assets/images/home/background.png" alt="">
  </div>
  <div class="home-main">
    <div class="home-content">
      <section class="home-section home-about">
        <h2 class="home-about__title">About</h2>
        <div class="home-about__text" [innerHTML]="'HOME.ABOUT' | translate"></div>
      </section>
      <section class="home-section home-pills">
        <div class="home-pill">
          <div class="home-pill__icon">
            <mat-icon svgIcon="explore"></mat-icon>
          </div>
          <p class="home-pill__text">Explore</p>
        </div>
        <div class="home-pill">
          <div class="home-pill__icon">
            <mat-icon svgIcon="architecture"></mat-icon>
          </div>
          <p class="home-pill__text">Create</p>
        </div>
        <div class="home-pill">
          <div class="home-pill__icon">
            <mat-icon svgIcon="share"></mat-icon>
          </div>
          <p class="home-pill__text">Share</p>
        </div>
        <div class="home-pill">
          <div class="home-pill__icon">
            <mat-icon svgIcon="support"></mat-icon>
          </div>
          <p class="home-pill__text">Support</p>
        </div>
      </section>
    </div>
  </div>
</main>
<app-navigation [mainActionType]="navigationMainActionType">
  <a routerLink="/sign-in" matTooltip="Sign in" matTooltipPosition="above" mat-icon-button aria-label="Example icon button with a delete icon">
    <mat-icon svgIcon="login"></mat-icon>
  </a>
  <a routerLink="/sign-up" matTooltip="Sign up" matTooltipPosition="above" mat-icon-button aria-label="Example icon button with a bookmark icon">
    <mat-icon svgIcon="person-add"></mat-icon>
  </a>
</app-navigation>
