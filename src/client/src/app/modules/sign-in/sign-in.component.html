<main class="sign-in">
  <div class="sign-in__main">
    <h2 class="sign-in__title as-h1">Sign in</h2>
    <form [formGroup]="signInForm" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
        <!--      <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>-->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" placeholder="pat@example.com"
               formControlName="password">
        <!--      <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>-->
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hidePassword">
          <mat-icon [svgIcon]="hidePassword ? 'visibility-off' : 'visibility'"></mat-icon>
        </button>
        <mat-hint><a routerLink="account-recovery" mat-button color="primary">Forgot password ?</a></mat-hint>
      </mat-form-field>
    </form>
    <div class="primary-actions actions">
      <button mat-flat-button color="primary">Log in</button>
    </div>
  </div>
</main>
<app-navigation [configuration]="navigationConfig">
  <a routerLink="/sign-up" matTooltip="Sign up" matTooltipPosition="above" mat-icon-button aria-label="Example icon button with a bookmark icon">
    <mat-icon svgIcon="person-add"></mat-icon>
  </a>
</app-navigation>
