<main class="sign-in">
  <div class="sign-in__main">
    <h2 class="sign-in__title as-h1">Sign in</h2>
    <form [formGroup]="signInForm" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" [errorStateMatcher]="customErrorStateMatcher" autocomplete="email">

        <mat-error *ngIf="hasRequiredError">Fill in all fields</mat-error>
        <mat-error *ngIf="hasPatternError">Email or password is invalid</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'"
               formControlName="password" autocomplete="current-password">
        <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hidePassword">
          <mat-icon [svgIcon]="hidePassword ? 'visibility-off' : 'visibility'"></mat-icon>
        </button>

        <mat-hint><a routerLink="account-recovery" mat-button color="primary">Forgot password ?</a></mat-hint>
      </mat-form-field>
    </form>
    <div class="primary-actions actions">
      <button mat-flat-button color="primary" (click)="signIn()">Sign in</button>
    </div>
  </div>
</main>
<app-navigation [configuration]="navigationConfig">
  <a routerLink="/sign-up" matTooltip="Sign up" matTooltipPosition="above" mat-icon-button aria-label="Example icon button with a bookmark icon">
    <mat-icon svgIcon="person-add"></mat-icon>
  </a>
</app-navigation>
