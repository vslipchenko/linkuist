<app-navigation [mainActionType]="navigationMainActionType">
  <button matTooltip="Add bookmark" matTooltipPosition="above" mat-icon-button (click)="addBookmark()">
    <mat-icon svgIcon="bookmark-plus"></mat-icon>
  </button>
</app-navigation>

<ng-template #addBookmarkContent>
  <form [formGroup]="addBookmarkForm" class="add-bookmark">
    <mat-form-field>
      <mat-label>Link</mat-label>
      <textarea type="url" matInput formControlName="link" required></textarea>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Title</mat-label>
      <input type="text" matInput formControlName="title" placeholder="Custom bookmark title" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Thumbnail url</mat-label>
      <input type="text" matInput formControlName="title" placeholder="Custom bookmark thumbnail" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea type="text" matInput formControlName="description"></textarea>
    </mat-form-field>
     <app-chips formControlName="tags"
                label="Tags"
                [areChipsRemovable]="true"
                [isInputAvailable]="true"
                [isAddOnBlurAvailable]="true"
                [chipsSeparatorKeyCodes]="tagsSeparatorKeysCodes"
                [chipSeparator]="tagSeparator"
                [chipLetterValidator]="tagRegExp"
                [areChipsLowerCased]="true"
     ></app-chips>
    <mat-slide-toggle formControlName="private" labelPosition="before">Private access</mat-slide-toggle>
  </form>
</ng-template>
<ng-template #addBookmarkActions>
  <button mat-dialog-close mat-stroked-button>Close</button>
  <!--    &lt;!&ndash; The mat-dialog-close directive optionally accepts a value as a result for the dialog. &ndash;&gt;-->
  <button mat-flat-button color="primary" [mat-dialog-close]="true">Add</button>
</ng-template>
