<main class="sign-up">
  <div class="sign-up__main">
    <h2 class="sign-up__item title as-h1">Sign up</h2>
    <form [formGroup]="signUpForm" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput placeholder="pat@example.com" formControlName="email" required>
        <mat-hint>Should be unique</mat-hint>
        <!--      <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>-->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput placeholder="pat@example.com" formControlName="username" required>
        <mat-hint>Should be unique</mat-hint>
        <!--      <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>-->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" placeholder="pat@example.com" formControlName="password" required>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
          <mat-icon [svgIcon]="hidePassword ? 'visibility-off' : 'visibility'"></mat-icon>
        </button>
        <mat-hint><button mat-button type="button" color="primary">Generate password</button></mat-hint>
        <!--      <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>-->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Repeat password</mat-label>
        <input matInput type="password" placeholder="pat@example.com" formControlName="repeatPassword" required>
        <!--      <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>-->
      </mat-form-field>
    </form>
    <div class="sign-up__item primary-actions actions">
      <button mat-flat-button color="primary">Sign up</button>
    </div>
    <div class="secondary-actions actions">
      <button mat-flat-button color="accent"><span class="social-icon">G</span>Sign up with Google</button>
      <button mat-flat-button color="accent"><span class="social-icon">f</span>Sign up with Facebook</button>
    </div>
  </div>
</main>
<app-navigation [configuration]="navigationConfig">
  <a routerLink="/login" mat-fab color="primary" aria-label="Example icon button with a delete icon">
    <mat-icon svgIcon="login"></mat-icon>
  </a>
</app-navigation>
