  <app-elastic-input
    placeholder="Capture your ideas..."
    maxCharacterLength="3000"
    extendClass="add-post-input"
  ></app-elastic-input>

  <div class="d-flex align-items-center border-top">
    <app-length-circle
      [diameter]="25"
      [value]="characterLength"
      [maxValue]="13"
      [defineColor]="defineLengthCircleColor"
    ></app-length-circle>

    <button
      mat-flat-button
      color="primary"
      class="button-note rounded-0"
      (click)="addPost.emit('')"
    >
      <!--      (click)="addPost.emit(postInput.textContent)"-->
      <mat-icon svgIcon="post-plus" class="mr-h"></mat-icon>
      Post
    </button>
  </div>
