<div class="d-flex align-items-end border-top">
  <!--    TODO: permissions-->
  <app-elastic-input
    class="w-100 min-width-0"
    [placeholder]="placeholder"
    [maxCharacterLength]="maxCharLength"
    [formControl]="addCommentControl"
  ></app-elastic-input>
  <div class="p-1">
    <button
      mat-icon-button
      color="primary"
      matTooltip="Add comment"
      matTooltipPosition="right"
      (click)="addComment()"
    >
      <mat-icon svgIcon="comment-plus"></mat-icon>
    </button>
  </div>
</div>
