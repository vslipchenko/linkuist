<ng-container
  *ngIf="{
    profileTeasers: profileTeasers$ | async,
    postCommentTotalCount: postCommentTotalCount$ | async,
    postCommentReplyTotalCount: postCommentReplyTotalCount$ | async
  } as data"
>
  <div class="post-section">
    <app-post-item
      [ngClasses]="{
        'border-top': true
      }"
      [isPost]="true"
      [showAddComment]="true"
      [avatarUrl]="data.profileTeasers[post.userId].avatarUrl"
      [username]="data.profileTeasers[post.userId].username"
      [isVerifiedUser]="data.profileTeasers[post.userId].isVerified"
      [creationDate]="post.date"
      [timeElapsedAfterCreation$]="post.timeElapsedAfterCreation$"
      [resolvedUserUrlUsername]="resolvedUser.urlUsername"
      [commentTotalCount]="data.postCommentReplyTotalCount"
      [likeTotalCount]="post.totalLikes"
      [dislikeTotalCount]="post.totalDislikes"
      [shareTotalCount]="post.totalShares"
      [body]="post.text"
      [liked]="post.like"
      (like)="handlePostLike($event)"
      (dislike)="handlePostDislike($event)"
      (share)="handlePostShare()"
      (delete)="handlePostDelete()"
      (comment)="comment($event)"
    ></app-post-item>

    <ng-container *ngIf="showPostComments">
      <ng-container *ngFor="let postComment of postComments$ | async; trackBy: postCommentsTrackBy">
        <ng-container
          *ngIf="{
            postReplyTotalCount: getPostReplyTotalCount$(postComment._id) | async
          } as commentData"
        >
          <app-post-comment
            [postItemComponent]="postItemComponent"
            [postId]="post._id"
            [commentId]="postComment._id"
            (newReply)="updateRecentlyAddedReplyIds($event)"
          >
            <app-post-item
              #postItemComponent
              [ngClasses]="{
                'border-accent-primary': true,
                'border-left-dashed': postComment.isRecentlyAdded
              }"
              [avatarUrl]="data.profileTeasers[post.userId].avatarUrl"
              [username]="data.profileTeasers[post.userId].username"
              [isVerifiedUser]="data.profileTeasers[post.userId].isVerified"
              [creationDate]="postComment.date"
              [timeElapsedAfterCreation$]="postComment.timeElapsedAfterCreation$"
              [resolvedUserUrlUsername]="resolvedUser.urlUsername"
              [commentTotalCount]="commentData.postReplyTotalCount"
              [body]="postComment.body"
            ></app-post-item>
          </app-post-comment>

          <app-post-replies
            [postId]="post._id"
            [commentId]="postComment._id"
            [profileTeasers]="data.profileTeasers"
            [resolvedUserUrlUsername]="resolvedUser.urlUsername"
            (newReply)="updateRecentlyAddedReplyIds($event)"
          ></app-post-replies>

          <app-comment-manage-panel
            [data]="getPostReplies$(postComment._id) | async"
            [isLoading]="isLoadingPostReplies$ | async"
            [totalCount]="commentData.postReplyTotalCount"
            (loadMore)="showReplies(postComment._id)"
            (hide)="hideReplyThread(postComment._id)"
          ></app-comment-manage-panel>
        </ng-container>
      </ng-container>
    </ng-container>

    <app-comment-manage-panel
      extendClass="border-top mt-1"
      [isComment]="true"
      [data]="postComments$ | async"
      [isLoading]="isLoadingPostComments$ | async"
      [totalCount]="data.postCommentTotalCount"
      (loadMore)="showComments($event, post._id)"
      (hide)="hideCommentThread(post._id)"
    ></app-comment-manage-panel>
  </div>
</ng-container>
