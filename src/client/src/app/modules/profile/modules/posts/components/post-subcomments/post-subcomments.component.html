<!--<div *ngIf="postSubcomments$ | async as postSubcomments">-->
<div
  *ngFor="let postSubcomment of postSubcomments$ | async; let index = index"
  class="post-item border-accent-secondary mt-glue"
  [class.border-left-dashed]="postSubcomment.isRecentlyAdded"
>
  <!--  <ng-container *ngFor="let postSubcomment of postSubcomments$ | async">-->
  <app-user-post-panel
    extendsClass="post-comment-user-panel p-2 border-bottom"
    [avatarUrl]="profileTeasers[postSubcomment.authorId].avatarUrl"
    [username]="profileTeasers[postSubcomment.authorId].username"
    [creationDate]="postSubcomment.date"
    [timeElapsedAfterCreation$]="postSubcomment.timeElapsedAfterCreation$"
    [resolvedUserUrlUsername]="resolvedUser.urlUsername"
    [isVerifiedUser]="profileTeasers[postSubcomment.authorId].isVerified"
  >
    <ng-content></ng-content>
  </app-user-post-panel>
  <div class="px-2 py-3">
    {{ postSubcomment.body }}
  </div>
  <div class="border-top color-light-dark d-flex justify-content-between">
    <!--  <div>-->
    <!-- !!! TODO Duplicate ng-content !!! -->
    <ng-content></ng-content>
    <!--  </div>-->

    <!--  <div>-->
    <button
      mat-button
      class="icon-button d-flex justify-content-center flex ml-auto max-width-content"
      (click)="(null)"
      [color]="null ? 'warn' : null"
    >
      <!--    <div style="display: flex; align-items: center" class="mr-1">-->
      <mat-icon svgIcon="heart" class="d-flex mr-h icon-sm"></mat-icon>
      <span class="font-weight-bold">27k</span>
      <!--    </div>-->
    </button>
    <!--  </div>-->
  </div>

  <app-add-comment
    *ngIf="_showAddReply"
    placeholder="Write a reply..."
    [maxCharLength]="0"
    (comment)="addPostSubcomment($event, index)"
  ></app-add-comment>
  <!--  </ng-container>-->
</div>
<!--</div>-->
