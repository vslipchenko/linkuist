<app-post-item
  *ngFor="let postSubcomment of postSubcomments$ | async; let index = index"
  [ngClasses]="{
    'border-accent-secondary mt-glue': true,
    'border-left-dashed': postSubcomment.isRecentlyAdded
  }"
  [avatarUrl]="profileTeasers[postSubcomment.userId].avatarUrl"
  [username]="profileTeasers[postSubcomment.userId].username"
  [isVerifiedUser]="profileTeasers[postSubcomment.userId].isVerified"
  [creationDate]="postSubcomment.date"
  [timeElapsedAfterCreation$]="postSubcomment.timeElapsedAfterCreation$"
  [resolvedUserUrlUsername]="resolvedUserUrlUsername"
  [body]="postSubcomment.body"
  (delete)="handlePostSubcommentDelete(postSubcomment._id)"
  (comment)="addPostSubcomment($event, index)"
></app-post-item>
