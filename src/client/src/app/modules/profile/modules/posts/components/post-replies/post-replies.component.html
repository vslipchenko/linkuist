<app-post-item
  *ngFor="let postReply of postReplies$ | async; let index = index"
  [ngClasses]="{
    'border-accent-secondary': true,
    'border-left-dashed': postReply.isRecentlyAdded
  }"
  [avatarUrl]="profileTeasers[postReply.userId].avatarUrl"
  [username]="profileTeasers[postReply.userId].username"
  [isVerifiedUser]="profileTeasers[postReply.userId].isVerified"
  [creationDate]="postReply.date"
  [timeElapsedAfterCreation$]="postReply.timeElapsedAfterCreation$"
  [resolvedUserUrlUsername]="resolvedUserUrlUsername"
  [body]="postReply.body"
  [liked]="postReply.like"
  [likeTotalCount]="postReply.totalLikes"
  [dislikeTotalCount]="postReply.totalDislikes"
  (delete)="handlePostReplyDelete(postReply._id)"
  (comment)="addPostReply($event, index)"
  (like)="handlePostReplyLike($event, postReply._id)"
  (dislike)="handlePostReplyDislike($event, postReply._id)"
></app-post-item>
