<main id="main" *ngIf="profile$ | async as profile">
  <!--  TODO: handle image error-->
  <div
    *ngIf="profile.backgroundUrl"
    class="user-background position-sticky t-0"
    [style.background-image]="'url(' + profile.backgroundUrl + ')'"
  ></div>
  <div class="profile-container position-relative">
    <div class="profile-background w-100 position-sticky t-0"></div>
    <div class="profile-content">
      <div class="user mx-auto" [class.profile-no-background]="!profile.backgroundUrl">
        <!--        <div class="user-images"></div>-->
        <!--  TODO: handle image error-->
        <div
          *ngIf="profile.avatarUrl"
          class="user-avatar"
          [class.border]="!profile.backgroundUrl"
          [class.border-light]="profile.backgroundUrl"
          [style.background-image]="'url(' + profile.avatarUrl + ')'"
        ></div>
        <div *ngIf="!profile.avatarUrl" class="user-avatar no-avatar"></div>
        <div class="user-info">
          <div class="user-names">
            <div *ngIf="profile.name" class="full-name">{{ profile.name }}</div>
            <div class="d-flex justify-content-center align-items-center">
              <div class="username">@vlad</div>
              <mat-icon
                class="user-verificon icon-sm ml-h"
                svgIcon="check-decagram"
                color="primary"
                matTooltip="Verified"
                matTooltipPosition="below"
              ></mat-icon>
            </div>
          </div>
          <div class="user-statistics w-100 border-top">
            <div class="statistic-item">
              <span class="font-weight-bold color-dark">108k</span> posts
            </div>
            <div class="statistic-item">
              <span class="font-weight-bold color-dark">2k</span> connections
            </div>
            <div class="statistic-item">
              <span class="font-weight-bold color-dark">27k</span> linkards
            </div>
          </div>
          <div class="user-fields w-100 border-top px-2 py-3" *ngIf="profile.bio">
            <div class="user-field">
              <div class="user-field-label">Bio</div>
              <div class="user-field-description">
                {{ profile.bio }}
              </div>
            </div>
          </div>
        </div>
      </div>
      <!--      <a [routerLink]="'/@vladd'"> NAVIGATE </a>-->
      <section class="notes">
        <app-posts></app-posts>
      </section>
    </div>
  </div>
</main>

<ng-template #profileSettingsContent>
  <form [formGroup]="profileSettingsForm">
    <div
      *ngIf="profileSettingsForm.controls.backgroundUrl.value"
      class="profile-settings-background"
      [style.background-image]="'url(' + profileSettingsForm.controls.backgroundUrl.value + ')'"
    ></div>
    <mat-form-field class="w-100">
      <mat-label>Background URL</mat-label>
      <textarea type="url" matInput formControlName="backgroundUrl"></textarea>
    </mat-form-field>
    <!--    https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Altja_j%C3%B5gi_Lahemaal.jpg/1920px-Altja_j%C3%B5gi_Lahemaal.jpg-->
    <div
      *ngIf="profileSettingsForm.controls.avatarUrl.value"
      class="profile-settings-avatar"
      [style.background-image]="'url(' + profileSettingsForm.controls.avatarUrl.value + ')'"
    ></div>
    <mat-form-field class="w-100">
      <mat-label>Avatar URL</mat-label>
      <textarea type="url" matInput formControlName="avatarUrl"></textarea>
    </mat-form-field>
    <mat-form-field class="w-100">
      <mat-label>Name</mat-label>
      <input type="text" matInput formControlName="name" />
    </mat-form-field>
    <mat-form-field class="w-100">
      <mat-label>Bio</mat-label>
      <textarea type="url" matInput formControlName="bio"></textarea>
    </mat-form-field>
  </form>
</ng-template>
<ng-template #profileSettingsActions>
  <button mat-flat-button color="primary" (click)="saveProfile()">Save</button>
  <button mat-dialog-close mat-stroked-button>Close</button>
</ng-template>

<app-navigation [mainActionType]="navigationMainActionType" [isMainActionPlainLink]="true">
  <!-- Link collections -->
  <a matTooltip="Linkards" matTooltipPosition="above" mat-icon-button routerLink="linkards">
    <mat-icon svgIcon="bookmark-collection"></mat-icon>
  </a>
  <ng-container *ngIf="isUser">
    <!-- Profile Settings -->
    <mat-menu #profileSettings>
      <a mat-menu-item routerLink="settings/profile" class="link-no-underline">
        <mat-icon svgIcon="account-edit"></mat-icon>
        Edit profile
      </a>
      <!--      <div mat-menu-item>-->
      <!--        <a routerLink="settings/_profile">-->
      <!--          <mat-icon svgIcon="account-edit"></mat-icon>-->
      <!--          Edit _profile-->
      <!--        </a>-->
      <!--      </div>-->
      <button mat-menu-item (click)="confirmLogout()">
        <mat-icon svgIcon="exit-to-app" color="accent"></mat-icon>
        Sign out
      </button>
    </mat-menu>
    <button
      [matMenuTriggerFor]="profileSettings"
      matTooltip="Settings"
      matTooltipPosition="above"
      mat-icon-button
      aria-label="Example icon button with a delete icon"
    >
      <mat-icon svgIcon="cog"></mat-icon>
    </button>
  </ng-container>
</app-navigation>
