<div *ngIf="resolvedUser?.role === UserRole.User" class="notes-add mx-auto">
  <textarea #postInput class="input" placeholder="Capture your ideas..."></textarea>
  <div class="panel">
    <button
      mat-flat-button
      color="primary"
      class="button-note"
      (click)="createPost(postInput.value)"
    >
      Post
    </button>
  </div>
</div>
<div class="notes-content" data-empty-notes="There are no notes yet...">
  <div *ngFor="let post of posts; trackBy: postsTrackBy" class="note">
    {{ post.text }}
  </div>
